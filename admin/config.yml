backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "/img"

collections:
  - name: "fotos"
    label: "Fotos de la Galeria"
    files:
      - name: "catalogo"
        label: "Catálogo de fotos"
        file: "datos.json"
        format: "json"
        fields:
          - name: "fotos"
            label: "Llista d'imatges"
            widget: "list"
            summary: "{{fields.descripcion}} ({{fields.categoria}})"
            fields:
              - label: "Arxiu (imatge o vídeo curt)"
                name: "archivo"
                widget: "file"
                required: false
                choose_url: false
                media_library:
                  config:
                    multiple: false
                pattern:
                  - '.*\.(jpe?g|png|webp|gif|mp4|webm|mov)$'
                  - "Nom d'arxiu no vàlid. Extensió permesa: jpg, jpeg, png, webp, gif, mp4, webm, mov"
              - label: "URL de YouTube (per vídeos llargs)"
                name: "youtube_url"
                widget: "string"
                required: false
                hint: "Exemple: https://youtu.be/02HlYmEOoUk o https://www.youtube.com/watch?v=02HlYmEOoUk"
              - label: "Categoria"
                name: "categoria"
                widget: "select"
                options:
                  - "astro"
                  - "paisatge"
                  - "macro"
                  - "moments"
              - label: "Descripció"
                name: "descripcion"
                widget: "string"
              - label: "Data (AAAA-MM o AAAA-MM-DD)"
                name: "fecha"
                widget: "string"
                hint: "Exemple: 2026-05 o 2026-05-29"
