backend:
  name: github
  repo: FermiBruna/mi-web
  branch: main
  base_url: https://mi-web-16p.pages.dev
  auth_endpoint: api/auth

media_folder: "img"
public_folder: "/img"

collections:
  - name: "fotos"
    label: "Fotos de la Galeria"
    files:
      - name: "catalogo"
        label: "Catálogo de fotos"
        file: "datos.json"
        format: "json"
        fields:
          - name: "fotos"
            label: "Llista d'imatges"
            widget: "list"
            summary: "{{fields.descripcion}} ({{fields.categoria}})"
            fields:
              - label: "Arxiu (imatge o vídeo curt)"
                name: "archivo"
                widget: "file"
                required: false
                choose_url: false
                media_library:
                  config:
                    multiple: false
                pattern:
                  - '.*\.(jpe?g|png|webp|gif|mp4|webm|mov)$'
                  - "Nom d'arxiu no vàlid. Extensió permesa: jpg, jpeg, png, webp, gif, mp4, webm, mov"
              - label: "Miniatura (només per a vídeos)"
                name: "miniatura"
                widget: "image"
                required: false
                choose_url: false
                hint: "Imatge que es mostra a la galeria abans de reproduir el vídeo. Si la deixes buida, es veu el primer fotograma."
              - label: "URL de YouTube (per vídeos llargs)"
                name: "youtube_url"
                widget: "string"
                required: false
                hint: "Exemple: https://youtu.be/02HlYmEOoUk o https://www.youtube.com/watch?v=02HlYmEOoUk"
              - label: "Categoria"
                name: "categoria"
                widget: "select"
                options:
                  - { label: "Astrofotografia", value: "astro" }
                  - { label: "Nocturnes", value: "nocturnes" }
                  - { label: "Paisatge", value: "paisatge" }
                  - { label: "Natura", value: "natura" }
                  - { label: "Moments", value: "moments" }
                  - { label: "Eclipsis", value: "eclipsis" }
                  - { label: "ICM - intentional camera movement", value: "icm" }
              - label: "Descripció"
                name: "descripcion"
                widget: "string"
              - label: "Data (AAAA-MM)"
                name: "fecha"
                widget: "string"
                hint: "Exemple: 2026-05"
